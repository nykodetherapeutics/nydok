# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

# Target Python version: the oldest nydok supports (pyproject.toml), which HPVSpot runs.
# A newer target lets fixes and formatting use syntax this version can't run.
target-version = "py310"

# Line length
line-length = 120
indent-width = 4

[lint]
# Enable a broad set of rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ERA", # flake8-eradicate
    "Q",   # flake8-quotes
    "T20", # flake8-print
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "RUF", # ruff native quality checks
    "ANN", # type annotations
    "D",   # docstring conventions
    "ARG", # unused arguments
]
ignore = ["E712", "N818", "D203", "D213", "D413"]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude common non-source directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
    "archive",
    "**/tests/**",
]

[format]
# Use double quotes
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Trailing commas in multi-line structures
skip-magic-trailing-comma = false
line-ending = "auto"
