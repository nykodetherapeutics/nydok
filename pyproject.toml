[project]
name = "nydok"
# Set from the release tag by ops/dev/build-package.sh
version = "0.0"
description = "Documentation and specification testing framework"
authors = [{ name = "Nykode Therapeutics", email = "insaid@nykode.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pytest>=9.0",
    "PyYAML>=6.0",
    "requests>=2.28.1",
    "lxml>=4.8.0",
    "click>=8.0.0",
]
# Poetry adds the Python version classifiers
dynamic = ["classifiers"]

[project.optional-dependencies]
# For nydok.markdown_ext, the Python-Markdown extension
markdown = ["Markdown>=3.4"]

[project.scripts]
nydok = "nydok.cli:cli"

[project.entry-points.pytest11]
nydok = "nydok.plugin.plugin"

[tool.poetry]
packages = [{ include = "nydok" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.6"
pytest-cov = "^7.0"
# 7.11+ needs Python 3.11
coverage = { extras = ["toml"], version = "^7.10" }
mypy = "^2.4.1"
mkdocs-material = "^9.5"
mkdocs-click = "^0.9.0"
pytest-httpserver = "^1.1.1"
types-Markdown = "^3.11.3"
types-PyYAML = "^6.0.12"
types-requests = "^2.32"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# docs/specification is a symlink to tests/
testpaths = ["tests"]

[tool.coverage.run]
omit = [ "tests/*" ]
# Measure the pytest runs that the tests start with pytester.runpytest_subprocess
patch = ["subprocess"]
